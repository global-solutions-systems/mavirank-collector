# Configuration for the offline dry run against the fixture logs (paths relative to the repository root).
[mavirank]
ingest_url = https://mavirank.example/api/v1/ingest
token = mvrk_log_TESTTOKENTESTTOKENTESTTOKENTESTTOKEN0000000

[logs]
access_log = tests/fixtures/access.log, tests/fixtures/vhost_access.log
error_log = tests/fixtures/error.log
format = auto
server = nginx
domain = example.com
hostnames = example.com, www.example.com
timezone = +01:00

[state]
dir = /nonexistent/mavirank-collector-dry-run

[bots]
verify = true
ranges_file = tests/fixtures/google-ranges

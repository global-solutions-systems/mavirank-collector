# mavirank collector configuration (INI), one file per website. Keep it private: chmod 600.

[mavirank]
# "Ingest URL" from the log source's install page in mavirank.
ingest_url = https://app.mavirank.example/api/v1/ingest
# Collector token (shown once when the log source is created or the token is rotated).
# Alternatively set the environment variable MAVIRANK_COLLECTOR_TOKEN.
token = mvrk_log_REPLACE_WITH_YOUR_TOKEN_000000000000000000
# Optional: CA bundle for a private CA. TLS verification cannot be switched off.
# ca_file = /etc/ssl/certs/my-ca.pem
# Local development only: allow plain http:// ingest URLs.
# allow_insecure_http = false
# timeout = 20

[logs]
# Access logs in the combined format (nginx and Apache default); comma separated, globs allowed.
# Rotated copies (.1, -YYYYMMDD) are followed automatically; compressed rotations are ignored.
access_log = /var/log/nginx/access.log
# Error logs (nginx or Apache); sent only if the log source has "error log" enabled.
error_log = /var/log/nginx/error.log
# auto | nginx_combined | apache_combined
format = auto
# nginx | apache
server = nginx
# Host name for lines without a virtual host field (required if the website has several
# host names, e.g. example.com and www.example.com, and the log has no vhost column).
domain = example.com
# Time zone of error log timestamps (they carry no offset): local, UTC, +01:00 or Europe/Berlin.
# timezone = local

[state]
# Offsets, day keys and caches (created with mode 0700). Default: ~/.local/state/mavirank-collector
# of the user running the collector (install.sh writes the full path here); the container image
# uses /var/lib/mavirank-collector.
# dir = /home/<user>/.local/state/mavirank-collector

[bots]
# Verify Googlebot against Google's published IP lists (reverse DNS as fallback).
verify = true
# Optional local copy of the lists (file or directory of Google's JSON files) for offline servers.
# ranges_file = /home/<user>/.config/mavirank-collector/google-ranges
